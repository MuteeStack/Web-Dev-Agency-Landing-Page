<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#fafaf8;color:#111;}
.pg{width:100%;height:600px;background:#fafaf8;position:relative;overflow:hidden;border-radius:16px;display:flex;flex-direction:column;}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;}
nav{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:22px 40px;background:rgba(250,250,248,0.75);backdrop-filter:blur(20px);flex-shrink:0;}
.logo{font-size:18px;font-weight:700;color:#111;letter-spacing:-0.5px;display:flex;align-items:center;gap:10px;}
.logo-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#ff6b35,#f7c59f,#90f1ef,#7b61ff);background-size:300% 300%;animation:gs 4s ease infinite;}
@keyframes gs{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
.nav-links{display:flex;list-style:none;gap:0;align-items:center;}
.nav-links a{text-decoration:none;font-size:13px;font-weight:400;color:#666;padding:8px 16px;border-radius:8px;display:block;transition:color .2s,background .2s;}
.nav-links a:hover{color:#111;background:rgba(0,0,0,0.05);}
.nav-cta{background:#111!important;color:#fafaf8!important;font-weight:500!important;padding:9px 22px!important;border-radius:100px!important;font-size:13px!important;}
.hero{position:relative;z-index:10;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px;margin-top:-40px;}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:500;color:#999;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:22px;animation:fu .8s ease both;}
.tag-dash{width:24px;height:1px;background:#ddd;}
@keyframes fu{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
h1{font-size:58px;font-weight:800;line-height:1.0;letter-spacing:-2.5px;color:#111;max-width:580px;margin-bottom:18px;animation:fu .9s .1s ease both;}
.wa{display:inline-block;background:linear-gradient(90deg,#ff6b35,#cc2fff,#00d4ff);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gs 3s ease infinite;}
.sub{font-size:15px;font-weight:300;color:#888;max-width:380px;line-height:1.8;margin-bottom:32px;animation:fu 1s .2s ease both;}
.btns{display:flex;gap:12px;align-items:center;animation:fu 1s .3s ease both;}
.btn-p{background:#111;color:#fafaf8;border:none;padding:13px 30px;border-radius:100px;font-size:14px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;}
.btn-p::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#ff6b35,#cc2fff,#00d4ff);opacity:0;transition:opacity .3s;}
.btn-p:hover::before{opacity:1;}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(0,0,0,.18);}
.btn-p span{position:relative;z-index:1;}
.btn-s{background:rgba(255,255,255,.7);color:#555;border:1px solid rgba(0,0,0,.12);padding:13px 26px;border-radius:100px;font-size:14px;font-weight:500;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;backdrop-filter:blur(8px);transition:background .2s,transform .2s;}
.btn-s:hover{background:rgba(255,255,255,.95);transform:translateY(-2px);}
.fbadge{position:absolute;z-index:15;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border-radius:100px;padding:10px 20px;font-size:12.5px;font-weight:600;box-shadow:0 4px 24px rgba(0,0,0,.08);white-space:nowrap;}
.fdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.fb1{top:22%;left:18%;border:1px solid rgba(255,107,53,.25);color:#cc4400;animation:fl1 5s ease-in-out infinite;}
.fb1 .fdot{background:linear-gradient(135deg,#ff6b35,#f7c59f);}
.fb2{top:16%;right:16%;border:1px solid rgba(204,47,255,.25);color:#9911cc;animation:fl2 6.5s ease-in-out infinite;}
.fb2 .fdot{background:linear-gradient(135deg,#cc2fff,#90f1ef);}
.fb3{top:48%;left:14%;border:1px solid rgba(0,212,255,.25);color:#0088aa;animation:fl3 5.5s ease-in-out infinite;}
.fb3 .fdot{background:linear-gradient(135deg,#00d4ff,#7b61ff);}
.fb4{top:50%;right:14%;border:1px solid rgba(123,97,255,.25);color:#5533bb;animation:fl4 7s ease-in-out infinite;}
.fb4 .fdot{background:linear-gradient(135deg,#7b61ff,#a78bfa);}
.fb5{bottom:28%;left:19%;border:1px solid rgba(255,107,53,.2);color:#aa3300;animation:fl5 6s ease-in-out infinite;}
.fb5 .fdot{background:linear-gradient(135deg,#ff6b35,#cc2fff);}
.fb6{bottom:26%;right:18%;border:1px solid rgba(0,212,255,.2);color:#006688;animation:fl6 5.8s ease-in-out infinite;}
.fb6 .fdot{background:linear-gradient(135deg,#00d4ff,#72efdd);}
@keyframes fl1{0%,100%{transform:translate(0,0) rotate(-1deg);}40%{transform:translate(6px,-10px) rotate(1.5deg);}70%{transform:translate(-4px,6px) rotate(-.5deg);}}
@keyframes fl2{0%,100%{transform:translate(0,0) rotate(1deg);}40%{transform:translate(-8px,-7px) rotate(-2deg);}70%{transform:translate(5px,9px) rotate(1deg);}}
@keyframes fl3{0%,100%{transform:translate(0,0) rotate(-.5deg);}40%{transform:translate(10px,7px) rotate(2deg);}70%{transform:translate(-6px,-8px) rotate(-1.5deg);}}
@keyframes fl4{0%,100%{transform:translate(0,0) rotate(1.5deg);}40%{transform:translate(-7px,9px) rotate(-1deg);}70%{transform:translate(5px,-7px) rotate(2deg);}}
@keyframes fl5{0%,100%{transform:translate(0,0) rotate(-1.5deg);}40%{transform:translate(8px,6px) rotate(1deg);}70%{transform:translate(-5px,-9px) rotate(-2deg);}}
@keyframes fl6{0%,100%{transform:translate(0,0) rotate(.5deg);}40%{transform:translate(-9px,-5px) rotate(-1.5deg);}70%{transform:translate(7px,8px) rotate(1.5deg);}}
</style>

<div class="pg" id="pg">
  <canvas id="c"></canvas>
  <div class="fbadge fb1"><div class="fdot"></div>Web Design</div>
  <div class="fbadge fb2"><div class="fdot"></div>Development</div>
  <div class="fbadge fb3"><div class="fdot"></div>Branding</div>
  <div class="fbadge fb4"><div class="fdot"></div>UI / UX</div>
  <div class="fbadge fb5"><div class="fdot"></div>Strategy</div>
  <div class="fbadge fb6"><div class="fdot"></div>SEO &amp; Growth</div>
  <nav>
    <div class="logo"><div class="logo-mark"></div>Forma</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Work</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#" class="nav-cta">Let's Build →</a></li>
    </ul>
  </nav>
  <div class="hero">
    <div class="tag"><span class="tag-dash"></span>Digital Studio<span class="tag-dash"></span></div>
    <h1>We design<br><span class="wa">the future</span><br>of the web</h1>
    <p class="sub">Premium websites and digital experiences for brands that refuse to be ordinary.</p>
    <div class="btns">
      <button class="btn-p"><span>Start a Project</span></button>
      <button class="btn-s">See Our Work ↗</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const pg     = document.getElementById('pg');
let W, H;

const SPACING   = 30;
const INFLUENCE = 150;
const palette   = [
  [255, 107,  53],
  [204,  47, 255],
  [  0, 212, 255],
  [123,  97, 255],
  [114, 239, 221],
];

let smoothMX = -9999, smoothMY = -9999;
let targetMX = -9999, targetMY = -9999;
let dots = [];

function buildGrid() {
  dots = [];
  const cols = Math.ceil(W / SPACING) + 2;
  const rows = Math.ceil(H / SPACING) + 2;
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      // Give every dot a unique idle wave fingerprint
      dots.push({
        bx:     col * SPACING,
        by:     row * SPACING,
        phaseX: Math.random() * Math.PI * 2,
        phaseY: Math.random() * Math.PI * 2,
        speed:  0.35 + Math.random() * 0.55,
        amp:    3 + Math.random() * 3,        // idle sway 3-6 px
        ci:     (row * 3 + col * 7) % palette.length,
        // random idle tint so dots already look a bit colourful at rest
        idleColor: palette[Math.floor(Math.random() * palette.length)],
        idleTint:  0.08 + Math.random() * 0.12, // how much idle colour bleeds in
      });
    }
  }
}

function resize() {
  W = canvas.width  = pg.offsetWidth;
  H = canvas.height = pg.offsetHeight;
  buildGrid();
}
resize();
window.addEventListener('resize', resize);

pg.addEventListener('mousemove', e => {
  const r = pg.getBoundingClientRect();
  targetMX = e.clientX - r.left;
  targetMY = e.clientY - r.top;
});
pg.addEventListener('mouseleave', () => { targetMX = -9999; targetMY = -9999; });

function lerp(a, b, t) { return a + (b - a) * t; }

let tick = 0;
function draw() {
  tick += 0.014;
  smoothMX = lerp(smoothMX, targetMX, 0.07);
  smoothMY = lerp(smoothMY, targetMY, 0.07);

  ctx.clearRect(0, 0, W, H);

  for (let i = 0; i < dots.length; i++) {
    const d = dots[i];

    // ── Idle breathing sway ──────────────────────────────
    const idleX = Math.sin(tick * d.speed + d.phaseX) * d.amp;
    const idleY = Math.cos(tick * d.speed * 0.75 + d.phaseY) * d.amp;

    let x = d.bx + idleX;
    let y = d.by + idleY;

    // Base idle appearance — clearly visible, slightly tinted
    const [ir, ig, ib] = d.idleColor;
    let dotR = 2.2;
    let alpha = 0.42;
    // blend grey with a hint of brand colour so the grid isn't flat
    let dr = Math.round(lerp(200, ir, d.idleTint));
    let dg = Math.round(lerp(200, ig, d.idleTint));
    let db = Math.round(lerp(205, ib, d.idleTint));

    // ── Cursor ripple ─────────────────────────────────────
    const dx   = d.bx - smoothMX;
    const dy   = d.by - smoothMY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < INFLUENCE) {
      const norm = 1 - dist / INFLUENCE;
      const ease = norm * norm;

      // Repel
      const push  = ease * 26;
      const angle = Math.atan2(dy, dx);
      x = d.bx + idleX + Math.cos(angle) * push;
      y = d.by + idleY + Math.sin(angle) * push;

      // Enlarge & full brand colour
      dotR  = 2.2 + ease * 4.5;
      alpha = 0.42 + ease * 0.55;

      const [pr, pg2, pb] = palette[d.ci];
      dr = Math.round(lerp(dr, pr, ease));
      dg = Math.round(lerp(dg, pg2, ease));
      db = Math.round(lerp(db, pb, ease));
    }

    ctx.beginPath();
    ctx.arc(x, y, dotR, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${dr},${dg},${db},${alpha})`;
    ctx.fill();
  }

  requestAnimationFrame(draw);
}
draw();
</script>
